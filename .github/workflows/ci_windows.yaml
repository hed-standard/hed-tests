name: CI Windows

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-suite-validation-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate test structure (validation tests)
        run: |
          python src/scripts/validate_test_structure.py json_test_data/validation_test_data
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate test structure (schema tests)
        run: |
          python src/scripts/validate_test_structure.py json_test_data/schema_test_data
        env:
          PYTHONIOENCODING: utf-8

      - name: Check test coverage
        run: |
          python src/scripts/check_coverage.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Run test utilities
        run: |
          python -m unittest discover tests
        env:
          PYTHONIOENCODING: utf-8
